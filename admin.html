<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小登哥后台</title>
  <link rel="stylesheet" href="./assets/styles/pages/admin.css">
</head>
<body>
  <div class="page-shell">
    <div id="login-view" class="login-wrap">
      <div class="login-badge">ZODIAC OPERATIONS</div>
      <h1>小登哥后台</h1>
      <p>统一管理报告、支付订单、返现账户、返现记录与提现审核。先登录，再进入工作台。</p>
      <div class="field">
        <label for="admin-username">管理员账号</label>
        <input id="admin-username" autocomplete="username" placeholder="请输入账号">
      </div>
      <div class="field">
        <label for="admin-password">管理员密码</label>
        <input id="admin-password" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary btn-block" id="login-btn">进入后台</button>
      <div class="error" id="login-error"></div>
    </div>

    <div id="dashboard-view" class="workspace hidden">
      <aside class="sidebar">
        <div class="brand-card">
          <div class="brand-mark">登</div>
          <div>
            <div class="brand-eyebrow">运营工作台</div>
            <div class="brand-title">小登哥后台</div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="overview">
            <span class="nav-icon">◎</span>
            <span class="nav-copy">
              <span class="nav-kicker">01</span>
              <span class="nav-label">总览</span>
            </span>
          </button>
          <button class="nav-item" data-view="reports">
            <span class="nav-icon">▣</span>
            <span class="nav-copy">
              <span class="nav-kicker">02</span>
              <span class="nav-label">报告管理</span>
            </span>
          </button>
          <button class="nav-item" data-view="orders">
            <span class="nav-icon">◫</span>
            <span class="nav-copy">
              <span class="nav-kicker">03</span>
              <span class="nav-label">支付订单</span>
            </span>
          </button>
          <button class="nav-item" data-view="accounts">
            <span class="nav-icon">◇</span>
            <span class="nav-copy">
              <span class="nav-kicker">04</span>
              <span class="nav-label">返现账户</span>
            </span>
          </button>
          <button class="nav-item" data-view="rewards">
            <span class="nav-icon">✦</span>
            <span class="nav-copy">
              <span class="nav-kicker">05</span>
              <span class="nav-label">返现记录</span>
            </span>
          </button>
          <button class="nav-item" data-view="withdrawals">
            <span class="nav-icon">△</span>
            <span class="nav-copy">
              <span class="nav-kicker">06</span>
              <span class="nav-label">提现审核</span>
            </span>
          </button>
        </nav>

        <div class="sidebar-note">
          <div class="note-title">当前重点</div>
          <p>优先关注支付异常、返现补发、提现审核与邀请归因修正。</p>
        </div>
      </aside>

      <main class="workspace-main">
        <header class="workspace-topbar">
          <div>
            <div class="workspace-breadcrumb" id="view-breadcrumb">运营中心 / 总览</div>
            <div class="topbar-kicker" id="view-kicker">OVERVIEW</div>
            <h1 class="workspace-title" id="view-title">总览</h1>
            <p class="workspace-subtitle" id="view-subtitle">查看核心指标、近 7 天趋势以及最近解锁记录。</p>
          </div>
          <div class="topbar-actions">
            <div class="chip chip-soft" id="env-status">本地环境</div>
            <div class="chip chip-soft" id="refresh-status">等待刷新</div>
            <div class="chip" id="login-status">已登录</div>
            <button class="btn btn-secondary" id="refresh-btn">刷新数据</button>
            <button class="btn btn-secondary" id="logout-btn">退出登录</button>
          </div>
        </header>

        <section id="module-container" class="module-container"></section>
      </main>
    </div>
  </div>

  <script type="module" src="./assets/scripts/pages/admin.js"></script>
</body>
</html>
