name: Build, Push & Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'assets/**'
      - 'img/**'
      - 'admin.html'
      - 'index.html'
      - 'preview-report-modes.html'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  NAMESPACE: dewey_zodiac
  IMAGE: zodiac-dewey-frontend
  DEPLOY_PATH: /opt/zodiac

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy frontend to ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin ${{ env.REGISTRY }} 2>/dev/null || true

            docker compose pull frontend
            docker compose up -d --force-recreate frontend
            docker compose ps frontend

            for i in $(seq 1 20); do
              if curl -fsSI http://127.0.0.1/ >/dev/null && curl -fsS http://127.0.0.1/ | grep -q "index.js?v=${{ github.sha }}"; then
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "Frontend deployment verification failed"
                exit 1
              fi
              sleep 3
            done

            docker image prune -f
